<!-- Main Content -->
<div class="col-md-9 col-lg-10 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">Manage Staff</h2>
            <p class="text-muted mb-0">Add, edit, or manage staff members</p>
        </div>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#staffModal">
            <i class="fas fa-user-plus me-2"></i>Add Staff
        </button>
    </div>

    <!-- Staff Grid -->
    <div class="row g-4">
        <!-- Staff 1 -->
         @for(staff of staffs();track staff.id){
        <div class="col-md-6 col-lg-4">
            <div class="card-custom shadow-sm">
                <div class="card-body text-center">

                    <!-- Profile Image -->
                    <img [src]="staff.photoUrl || 'https://via.placeholder.com/100'" alt="Staff"
                        class="rounded-circle mb-3" style="width: 100px; height: 100px; object-fit: cover;">

                    <!-- Name -->
                    <h5>{{staff.firstName}} {{staff.lastName}}</h5>

                    <!-- Status -->
                    <span class="badge mb-2" [ngClass]="staff.isActive ? 'bg-success' : 'bg-secondary'">
                        {{ staff.isActive ? 'Active' : 'Inactive' }}
                    </span>

                    <!-- Bio -->
                    <p class="text-muted small px-2">
                        {{staff.bio}}
                    </p>

                    <!-- Contact Info -->
                    <div class="text-start small mb-3 px-2">
                        <p class="mb-1">
                            <i class="fas fa-envelope me-2 text-primary"></i>
                            {{staff.email}}
                        </p>
                        <p class="mb-0">
                            <i class="fas fa-phone me-2 text-success"></i>
                            {{staff.phone}}
                        </p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-center gap-2">
                        <a class="btn btn-sm btn-outline-primary" [routerLink]="['/staff',staff.id]">
                            <i class="fas fa-edit"></i>
                        </a>
                        
                        <button class="btn btn-sm btn-outline-danger" (click)="deleteStaff(staff.id)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>
        }
        <!-- Add New Staff Card -->
        <div class="col-md-6 col-lg-4">
            <div class="card-custom d-flex align-items-center justify-content-center" style="min-height: 310px;">
                <div class="text-center">
                    <i class="fas fa-user-plus text-muted" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">Add New Staff</h5>
                    <p class="text-muted">Click to add a new team member</p>
                    <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#staffModal">
                        <i class="fas fa-plus me-2"></i>Add Staff
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
